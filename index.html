<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>일본어 카드</title>
<style>
:root{--bg:#f6f5f1;--sf:#fff;--tx:#1f2328;--mu:#6b7280;--bd:#e2e0d8;--ac:#c2410c;--ac2:#fff4ec;--ok:#15803d;--bad:#b91c1c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17171a;--sf:#222226;--tx:#ececec;--mu:#9a9aa3;--bd:#34343a;--ac:#fb923c;--ac2:#2c2118;--ok:#4ade80;--bad:#f87171;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17171a;--sf:#222226;--tx:#ececec;--mu:#9a9aa3;--bd:#34343a;--ac:#fb923c;--ac2:#2c2118;--ok:#4ade80;--bad:#f87171;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Noto Sans KR","Noto Sans JP",sans-serif}
.app{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:18px;margin:4px 0 12px}
nav{display:flex;gap:6px;margin-bottom:14px}
nav button{flex:1;padding:10px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:10px;font-size:14px;cursor:pointer}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:20px}
.stats{display:flex;gap:8px;margin-bottom:12px}
.stat{flex:1;background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px}.stat span{font-size:12px;color:var(--mu)}
select,input,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;font-size:15px}
textarea{min-height:110px;font-size:13px}
label{display:block;font-size:12px;color:var(--mu);margin:10px 0 4px}
.flash{min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px}
.front{font-size:54px;line-height:1.2;word-break:break-all}
.back{font-size:24px}.read{font-size:20px;color:var(--ac)}
.hint{color:var(--mu);font-size:13px}
.btn{padding:12px 16px;border:0;border-radius:10px;background:var(--ac);color:#fff;font-size:15px;cursor:pointer}
.btn.ghost{background:var(--sf);color:var(--tx);border:1px solid var(--bd)}
.btn.full{width:100%;margin-top:12px}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.grades button{padding:12px 4px;border:1px solid var(--bd);border-radius:10px;background:var(--sf);color:var(--tx);font-size:14px;cursor:pointer}
.grades small{display:block;color:var(--mu);font-size:11px;margin-top:2px}
.row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}.row .t{flex:1;min-width:0}.row .t div:last-child{color:var(--mu);font-size:13px}
.tag{font-size:11px;background:var(--ac2);color:var(--ac);border-radius:6px;padding:2px 6px}
.x{border:0;background:none;color:var(--bad);font-size:18px;cursor:pointer}
.list{max-height:50vh;overflow-y:auto}
.done{text-align:center;padding:30px 0}.done h2{margin:0 0 6px}
.msg{font-size:13px;color:var(--ok);margin-top:8px;min-height:18px}
.sp{height:10px}.hd{display:flex;align-items:center;justify-content:space-between}#gear{border:1px solid var(--bd);background:var(--sf);border-radius:10px;padding:6px 10px;font-size:18px;cursor:pointer}.dk{cursor:pointer}
</style>
</head>
<body>
<div class="app">
<div class="hd"><h1>🎴 일본어 카드</h1><button id="gear" aria-label="설정">⚙️</button></div>
<nav id="nav"></nav>
<div id="view"></div>
</div>

1 부사", "N1 명사", "N1 한자어(영상)", "시험 파트 5~8 단어", "관용구·동작 표현", "문법·표현 포인트"];
function b64(x){return Uint8Array.from(atob(x),function(c){return c.charCodeAt(0);});}
function instd(){var i=[];try{i=JSON.parse(localStorage.getItem(KEY+'_pk')||'[]');}catch(e){}return i;}
function vis(c){return S.auth||PD.indexOf(c.d)<0;}
S.auth=false;try{S.auth=localStorage.getItem(KEY+'_auth')==='1'&&PD.every(function(n){return instd().indexOf(n)>=0;});}catch(e){}
function login(pw){
  return crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']).then(function(k){
    return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(ENC.s),iterations:200000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);
  }).then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:b64(ENC.i)},k,b64(ENC.c));}).then(function(buf){
    var pk=JSON.parse(new TextDecoder().decode(buf)),inst=instd();
    pk.forEach(function(p){if(inst.indexOf(p[0])>=0)return;p[1].split('\n').forEach(function(x){var a=x.split('|');if(a.length<3)return;var k=mk(a[0],a[2],a[1],p[0]);k.t=p[2]||'단어';S.cards.push(k);});inst.push(p[0]);});
    save();try{localStorage.setItem(KEY+'_pk',JSON.stringify(inst));localStorage.setItem(KEY+'_auth','1');}catch(e){}
    S.auth=true;
  });
}

function esc(s){var d=document.createElement('div');d.textContent=s==null?'':s;return d.innerHTML;}
function decks(){var o=['전체'];S.cards.forEach(function(c){if(vis(c)&&o.indexOf(c.d)<0)o.push(c.d);});return o;}
function inDeck(c){return vis(c)&&(S.deck==='전체'||c.d===S.deck);}
function today(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function newToday(){try{var o=JSON.parse(localStorage.getItem(KEY+'_nd')||'{}');return o.d===today()?o.c:0;}catch(e){return 0;}}
function incNew(){try{localStorage.setItem(KEY+'_nd',JSON.stringify({d:today(),c:newToday()+1}));}catch(e){}}
function setLim(n){S.lim=Math.max(1,Math.min(5000,n||20));try{localStorage.setItem(KEY+'_lim',String(S.lim));}catch(e){}}
function counts(){var now=Date.now(),du=0,nw=0;S.cards.forEach(function(c){if(!inDeck(c))return;if(!c.n)nw++;else if(c.due<=now)du++;});return {du:du,nw:nw};}
function build(){
  var now=Date.now(),due=[],nw=[];
  S.cards.forEach(function(c){if(!inDeck(c))return;if(!c.n)nw.push(c);else if(c.st===2&&c.due<=now)due.push(c);});
  function sh(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
  S.q=sh(due).concat(sh(nw).slice(0,Math.max(0,S.lim-newToday())));next();
}
function next(){
  var now=Date.now(),l=S.cards.filter(function(c){return inDeck(c)&&c.n&&c.st===1;}).sort(function(a,b){return a.due-b.due;});
  S.wait=null;S.wn=l.length;
  if(l.length&&l[0].due<=now)S.cur=l[0];
  else if(S.q.length)S.cur=S.q.shift();
  else{S.cur=null;if(l.length)S.wait={t:l[0].due,n:l.length};}
  S.shown=false;
}
function plan(c,g){
  var now=Date.now(),M=6e4,nw=!c.n,I=c.int||0,e=nw?2:(c.ease||2),rl=nw?0:(c.rl||0),l=c.lapses||0,r={st:1,int:I,ease:e,rl:rl,l:l};
  if(nw||c.st===1){
    if(g===0)r.due=now+5*M;else if(g===1)r.due=now+10*M;
    else{r.int=g===2?Math.max(2,rl):Math.max(4,rl*2);r.st=2;r.rl=0;r.due=now+r.int*DAY;}
  }else{
    var b=Math.max(1,I);r.st=2;
    if(g===0){r.ease=Math.max(1.3,e-.2);r.rl=Math.max(1,Math.round(b*.5));r.st=1;r.l=l+1;r.due=now+5*M;}
    else{
      if(g===1){r.int=Math.max(2,Math.round(b*1.2));r.ease=Math.max(1.3,e-.15);}
      else if(g===2)r.int=Math.round(b*e);
      else{r.int=Math.round(b*e*2);r.ease=e+.15;}
      r.int=Math.min(365,r.int);r.due=now+r.int*DAY;
    }
  }
  return r;
}
function grade(g){var c=S.cur;if(!c)return;var wasNew=!c.n,r=plan(c,g);if(wasNew)incNew();c.n=1;c.st=r.st;c.int=r.int;c.ease=r.ease;c.rl=r.rl;c.lapses=r.l;c.due=r.due;save();next();render();}
function speak(t){try{var u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}}

function askUI(){
  var o=document.getElementById('ask');if(o)o.remove();if(!S.ask)return;
  var d=document.createElement('div');d.id='ask';d.style.cssText='position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50';
  var nt=newToday();
  d.innerHTML='<div class="card" style="width:100%;max-width:360px"><b style="font-size:18px">오늘의 학습량은?</b><div class="hint">오늘 새로 공부할 카드 수를 정해 주세요. 복습할 카드는 따로 모두 나와요.'+(nt?' (오늘 새 카드 '+nt+'장 공부함)':'')+'</div><label>새 카드 개수</label><input id="al" type="number" min="1" inputmode="numeric" value="'+S.lim+'"><div class="grades" style="grid-template-columns:repeat(3,1fr)"><button data-n="20">20</button><button data-n="50">50</button><button data-n="100">100</button></div><button class="btn full" id="ok">시작하기</button></div>';
  document.body.appendChild(d);
  var al=document.getElementById('al');
  d.querySelectorAll('[data-n]').forEach(function(b){b.onclick=function(){al.value=b.dataset.n;};});
  document.getElementById('ok').onclick=function(){setLim(parseInt(al.value,10));S.ask=false;build();render();};
}
function render(){
  var nav=document.getElementById('nav'),tabs=[['study','학습'],['photo','사진'],['cards','카드'],['data','백업']].filter(function(t){return t[0]!=='photo'||window.claude;});
  nav.innerHTML=tabs.map(function(t){return '<button data-t="'+t[0]+'" class="'+(S.tab===t[0]?'on':'')+'">'+t[1]+'</button>';}).join('');
  nav.querySelectorAll('button').forEach(function(b){b.onclick=function(){S.tab=b.dataset.t;S.msg='';if(S.tab==='study')build();render();};});
  document.getElementById('gear').onclick=function(){S.tab='set';S.msg='';render();};
  var v=document.getElementById('view');
  if(S.tab==='study')viewStudy(v);else if(S.tab==='photo')viewPhoto(v);else if(S.tab==='cards')viewCards(v);else if(S.tab==='set')viewSet(v);else viewData(v);
  askUI();
}

function bindDeck(){var s=document.getElementById('deck');if(s)s.onchange=function(){S.deck=s.value;build();render();};}

function lab(c,g){var d=plan(c,g).due-Date.now();return d<36e5?Math.max(1,Math.round(d/6e4))+'분':d<864e5?Math.round(d/36e5)+'시간':Math.round(d/864e5)+'일';}
function viewStudy(v){
  var k=counts(),left=Math.max(0,S.lim-newToday()),h='<div class="stats"><div class="stat"><b>'+k.du+'</b><span>복습</span></div><div class="stat"><b>'+Math.min(k.nw,left)+'</b><span>새 카드</span></div><div class="stat"><b>'+(S.q.length+(S.cur?1:0)+(S.wn||0))+'</b><span>남은 카드</span></div></div>'+deckSel()+'<div class="sp"></div>';
  var c=S.cur;
  if(!c){
    if(S.wait){var m=Math.max(1,Math.ceil((S.wait.t-Date.now())/6e4));h+='<div class="card done"><h2>잠시 쉬어요 ☕</h2><div class="hint">다음 카드는 약 '+m+'분 뒤에 다시 나와요 (대기 '+S.wait.n+'장).</div><button class="btn full ghost" id="chk">지금 확인</button></div>';}
    else h+='<div class="card done"><h2>오늘 학습 끝 🎉</h2><div class="hint">'+(k.nw>0&&left===0?'오늘 정한 새 카드 학습량을 채웠어요.':'다음 복습 시간이 되면 다시 와 주세요.')+'</div></div>';
  }else{
    h+='<div class="card flash">'+(c.t?'<span class="tag">'+esc(c.t)+'</span>':'')+'<div class="front"'+(c.f.length>8?' style="font-size:26px"':'')+'>'+esc(c.f)+'</div>';
    if(S.shown){h+='<div class="back">'+esc(c.b)+'</div>'+(c.r?'<div class="read">'+esc(c.r)+'</div>':'');}
    else h+='<div class="hint">스페이스바 또는 아래 버튼으로 정답 확인</div>';
    h+='<button class="btn ghost" id="spk">🔊 듣기</button></div>';
    if(!S.shown)h+='<button class="btn full" id="rev">정답 보기</button>';
    else h+='<div class="grades">'+['다시','어려움','좋음','쉬움'].map(function(n,i){return '<button data-g="'+i+'">'+n+'<small>'+lab(c,i)+'</small></button>';}).join('')+'</div>';
  }
  v.innerHTML=h;bindDeck();
  var r=document.getElementById('rev');if(r)r.onclick=function(){S.shown=true;render();};
  var ck=document.getElementById('chk');if(ck)ck.onclick=function(){next();render();};
  var sp=document.getElementById('spk');if(sp)sp.onclick=function(){speak(c.r||c.f);};
  v.querySelectorAll('[data-g]').forEach(function(b){b.onclick=function(){grade(+b.dataset.g);};});
}

function viewCards(v){
  var h='<div class="card"><label>앞면 (일본어)</label><input id="af" placeholder="例: 猫"><label>뒷면 (뜻)</label><input id="ab" placeholder="예: 고양이"><label>읽는 법 (선택)</label><input id="ar" placeholder="ねこ"><label>덱 이름</label><input id="ad" value="'+esc(S.deck==='전체'?'내 카드':S.deck)+'"><button class="btn full" id="add">카드 추가</button><div class="msg">'+esc(S.msg)+'</div></div><div class="sp"></div><input id="srch" placeholder="검색" value="'+esc(S.search)+'"><div class="sp"></div><div class="card list" id="lst"></div>';
  v.innerHTML=h;fillList();
  document.getElementById('add').onclick=function(){
    var f=document.getElementById('af').value.trim(),b=document.getElementById('ab').value.trim();
    if(!f||!b){S.msg='앞면과 뒷면을 입력해 주세요.';render();return;}
    S.cards.push(mk(f,b,document.getElementById('ar').value.trim(),document.getElementById('ad').value.trim()||'내 카드'));
    save();S.msg='추가했어요: '+f;render();
  };
  document.getElementById('srch').oninput=function(e){S.search=e.target.value;fillList();};
}
function fillList(){
  var l=document.getElementById('lst'),q=S.search.toLowerCase();
  var items=S.cards.filter(function(c){return vis(c)&&(!q||(c.f+c.b+c.r+c.d).toLowerCase().indexOf(q)>=0);}).slice(-400).reverse();
  l.innerHTML=items.length?items.map(function(c){return '<div class="row"><div class="t"><div>'+esc(c.f)+' <span class="tag">'+esc(c.d)+'</span></div><div>'+esc(c.b)+(c.r?' · '+esc(c.r):'')+'</div></div><button class="x" data-id="'+c.id+'" aria-label="삭제">✕</button></div>';}).join(''):'<div class="hint">카드가 없어요.</div>';
  l.querySelectorAll('.x').forEach(function(b){b.onclick=function(){S.cards=S.cards.filter(function(c){return c.id!==b.dataset.id;});save();fillList();};});
}

function resize(file){return new Promise(function(res,rej){var im=new Image(),u=URL.createObjectURL(file);im.onload=function(){var s=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(function(b){b?res(b):rej({code:'img'});},'image/jpeg',.85);};im.onerror=function(){rej({code:'img'});};im.src=u;});}
function mkPrompt(){
  return '너는 일본어 교재 페이지 사진을 한국어 학습자용 암기 카드로 바꿔 주는 도우미야. 사진 속 내용을 읽고 카드를 만들어.\n'
  +'카드 종류(t): "단어"(f=일본어 표기, b=한국어 뜻, r=히라가나 읽기), "문법"(f=문형, b=한국어 설명과 접속 방법, r=대표 예문 일본어 한 줄), "예문"(f=일본어 예문, b=한국어 번역, r=히라가나 읽기), "문제"(f=빈칸 채우기나 번역 같은 연습문제, b=정답과 짧은 해설, r=비워 둠).\n'
  +'규칙: 사진에 나온 단어와 문법은 빠짐없이 단어, 문법 카드로 만든다. 문법마다 직접 만든 예문 1~2개와 연습문제 1~2개를 추가한다. 사진에 연습문제가 있으면 그대로 문제 카드로 만든다. 읽기 어려운 부분은 건너뛰고 지어내지 않는다. 한 번에 최대 60장.\n'
  +(S.pnote.trim()?'사용자 요청: '+S.pnote.trim()+'\n':'')
  +'JSON만 출력하고 다른 말은 쓰지 마: {"cards":[{"t":"단어","f":"","b":"","r":""}]}';
}
function errMsg(e){var c=e&&e.code;if(c==='none'||c==='not_granted')return '이 기능을 쓰려면 Claude 사용을 허용해야 해요.';if(c==='rate_limited')return '요청이 몰렸어요. 잠시 후 다시 시도해 주세요.';if(c==='img')return '사진을 읽지 못했어요. 다른 사진으로 시도해 주세요.';if(c==='cancelled')return '';return '카드를 만들지 못했어요. 다시 시도해 주세요.';}
function gen(){
  if(!S.pfile){S.perr='사진을 먼저 골라 주세요.';render();return;}
  S.busy=true;S.perr='';S.gen=[];render();
  resize(S.pfile).then(function(b){
    if(!window.claude)throw {code:'none'};
    return claude.use('sample').then(function(sm){
      if(!sm)throw {code:'none'};
      return sm.json(mkPrompt(),{images:[b],modelTier:'default',cache:false});
    });
  }).then(function(d){
    var a=Array.isArray(d)?d:((d&&d.cards)||[]);
    S.gen=a.filter(function(c){return c&&c.f&&c.b;}).map(function(c){return {t:String(c.t||'단어'),f:String(c.f),b:String(c.b),r:String(c.r||'')};});
    if(!S.gen.length)S.perr='카드를 찾지 못했어요. 글자가 잘 보이게 다시 찍어 주세요.';
  }).catch(function(e){S.perr=errMsg(e);}).then(function(){S.busy=false;render();});
}
function viewPhoto(v){
  var h='<div class="card"><b>교재 사진으로 카드 만들기</b><div class="hint">페이지 사진을 올리면 단어, 문법, 예문, 연습문제 카드를 자동으로 만들어요. 사용량은 내 Claude 계정에서 차감돼요.</div><label>사진</label><input type="file" id="pf" accept="image/*">'+(S.pfile?'<div class="hint">선택됨: '+esc(S.pfile.name)+'</div>':'')+'<label>덱 이름</label><input id="pd" value="'+esc(S.pdeck)+'" placeholder="예: 민나노 3과"><label>요청 (선택)</label><input id="pn" value="'+esc(S.pnote)+'" placeholder="예: 문법 위주로, 예문 많이"><button class="btn full" id="pg"'+(S.busy?' disabled':'')+'>'+(S.busy?'만드는 중… 1분 정도 걸려요':'카드 만들기')+'</button><div class="msg" style="color:var(--bad)">'+esc(S.perr)+'</div></div>';
  if(S.gen.length){h+='<div class="sp"></div><div class="card"><b>미리보기 '+S.gen.length+'장</b><div class="hint">필요 없는 카드는 ✕로 빼세요.</div><div class="list">'+S.gen.map(function(c,i){return '<div class="row"><div class="t"><div>'+esc(c.f)+' <span class="tag">'+esc(c.t)+'</span></div><div>'+esc(c.b)+(c.r?' · '+esc(c.r):'')+'</div></div><button class="x" data-i="'+i+'" aria-label="빼기">✕</button></div>';}).join('')+'</div><button class="btn full" id="pa">'+S.gen.length+'장 모두 추가</button></div>';}
  v.innerHTML=h;
  document.getElementById('pf').onchange=function(e){S.pfile=e.target.files[0]||null;};
  document.getElementById('pd').oninput=function(e){S.pdeck=e.target.value;};
  document.getElementById('pn').oninput=function(e){S.pnote=e.target.value;};
  document.getElementById('pg').onclick=gen;
  v.querySelectorAll('.x').forEach(function(b){b.onclick=function(){S.gen.splice(+b.dataset.i,1);render();};});
  var pa=document.getElementById('pa');
  if(pa)pa.onclick=function(){
    var d=S.pdeck.trim()||'사진 카드';
    S.gen.forEach(function(c){var k=mk(c.f,c.b,c.r,d);k.t=c.t;S.cards.push(k);});
    save();S.deck=d;S.gen=[];S.pfile=null;S.tab='study';build();render();
  };
}
function viewSet(v){
  var h;
  if(!S.auth){
    h='<div class="card"><b>설정</b><div class="hint">로그인하면 저장해 둔 전체 카드를 볼 수 있어요.</div><label>비밀번호</label><input id="pw" type="password" inputmode="numeric" autocomplete="off" placeholder="비밀번호"><button class="btn full" id="li">로그인</button><div class="msg" style="color:var(--bad)">'+esc(S.msg)+'</div></div>';
  }else{
    var mine=S.cards.filter(function(c){return PD.indexOf(c.d)>=0;}),w=0,o=0,dk={},ln={};
    mine.forEach(function(c){if((c.t||'단어')==='단어')w++;else o++;dk[c.d]=(dk[c.d]||0)+1;if(c.n)ln[c.d]=(ln[c.d]||0)+1;});
    var learned=mine.filter(function(c){return c.n;}).length;
    var extra=S.cards.filter(function(c){return PD.indexOf(c.d)<0&&['히라가나','가타카나','단어'].indexOf(c.d)<0;}).length;
    h='<div class="card"><b>내가 넣은 카드</b><div class="hint">총 '+mine.length+'장 · 덱을 누르면 목록이 열려요</div><div class="sp"></div><div class="stats"><div class="stat"><b>'+w+'</b><span>단어</span></div><div class="stat"><b>'+o+'</b><span>문장·표현·문법</span></div><div class="stat"><b>'+learned+'</b><span>학습 시작</span></div></div>'
    +PD.map(function(n){return '<div class="row dk" data-dk="'+esc(n)+'"><div class="t"><div>'+esc(n)+'</div><div>학습 시작 '+(ln[n]||0)+' / '+(dk[n]||0)+'장</div></div><span class="tag">'+(dk[n]||0)+'장</span></div>';}).join('')
    +(extra?'<div class="hint">직접 추가한 카드 '+extra+'장 (카드 탭에서 확인)</div>':'')
    +'</div><div class="sp"></div><div class="card"><b>오늘의 학습량</b><div class="hint">하루에 새로 공부할 카드 수예요.</div><input id="lm" type="number" min="1" value="'+S.lim+'"><button class="btn full ghost" id="ls">저장</button></div><div class="sp"></div><button class="btn full ghost" id="lo">로그아웃</button>';
  }
  v.innerHTML=h;
  var li=document.getElementById('li');
  if(li){
    var go=function(){var pw=document.getElementById('pw').value;li.disabled=true;
      Promise.resolve().then(function(){return login(pw);}).then(function(){S.msg='';S.tab='study';S.ask=true;build();render();}).catch(function(){S.msg=(window.crypto&&crypto.subtle)?'비밀번호가 틀렸어요.':'이 환경에서는 로그인을 쓸 수 없어요. https 주소에서 열어 주세요.';render();});};
    li.onclick=go;document.getElementById('pw').onkeydown=function(e){if(e.key==='Enter')go();};
  }
  var ls=document.getElementById('ls');if(ls)ls.onclick=function(){setLim(parseInt(document.getElementById('lm').value,10));ls.textContent='저장했어요 ✓';};
  var lo=document.getElementById('lo');
  if(lo)lo.onclick=function(){try{localStorage.removeItem(KEY+'_auth');}catch(e){}S.auth=false;S.deck='전체';S.tab='study';build();render();};
  v.querySelectorAll('.dk').forEach(function(r){r.onclick=function(){S.search=r.dataset.dk;S.tab='cards';render();};});
}
function viewData(v){
  v.innerHTML='<div class="card"><b>내보내기 / 백업</b><div class="hint">진행 상황까지 포함된 텍스트예요. 복사해서 메모장에 보관하세요.</div><label>백업 텍스트</label><textarea id="exp" readonly></textarea><button class="btn full ghost" id="cp">복사</button><button class="btn full" id="dl">JSON 파일로 저장</button></div><div class="sp"></div><div class="card"><b>가져오기</b><div class="hint">백업 텍스트를 붙여 넣거나, 한 줄에 한 장씩<br>앞면, 뒷면, 읽는 법, 덱 (쉼표 또는 탭 구분)</div><input type="file" id="if" accept=".json,application/json"><div class="sp"></div><textarea id="imp" placeholder="猫, 고양이, ねこ, 내 카드"></textarea><button class="btn full" id="go">가져오기</button><div class="msg" id="m">'+esc(S.msg)+'</div></div><div class="sp"></div><div class="card"><b>초기화</b><div class="hint">모든 카드와 진행 상황이 지워져요.</div><button class="btn full ghost" id="rs">'+(S.rst?'정말 지울까요? 한 번 더 누르세요':'처음 상태로 되돌리기')+'</button></div>';
  document.getElementById('exp').value=JSON.stringify(S.cards.filter(vis));
  document.getElementById('dl').onclick=function(){try{var b=new Blob([JSON.stringify(S.cards.filter(vis))],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='japanese-cards-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();}catch(e){}};
  document.getElementById('if').onchange=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){document.getElementById('imp').value=r.result;document.getElementById('go').click();};r.readAsText(f);};
  document.getElementById('cp').onclick=function(){var t=document.getElementById('exp');t.select();try{document.execCommand('copy');S.msg='복사했어요.';}catch(e){S.msg='직접 선택해서 복사해 주세요.';}document.getElementById('m').textContent=S.msg;};
  document.getElementById('go').onclick=function(){
    var t=document.getElementById('imp').value.trim(),n=0;
    if(!t){return;}
    try{var j=JSON.parse(t);if(Array.isArray(j)){j.forEach(function(c){if(c&&c.f&&c.b){var x=S.cards.filter(function(y){return y.f===c.f&&y.b===c.b&&y.d===c.d;})[0];if(x){x.ease=c.ease;x.int=c.int;x.due=c.due;x.n=c.n;}else{c.id=uid();S.cards.push(c);}n++;}});}}
    catch(e){t.split(/\r?\n/).forEach(function(line){var p=line.split(/\t|,/).map(function(x){return x.trim();});if(p[0]&&p[1]){S.cards.push(mk(p[0],p[1],p[2],p[3]||'내 카드'));n++;}});}
    save();S.msg=n+'장 가져왔어요.';render();
  };
  document.getElementById('rs').onclick=function(){
    if(!S.rst){S.rst=true;render();return;}
    S.rst=false;S.cards=seed();save();try{localStorage.removeItem(KEY+'_pk');localStorage.removeItem(KEY+'_auth');}catch(e){}location.reload();
  };
}
document.addEventListener('keydown',function(e){
  if(S.tab!=='study'||!S.cur||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
  if(!S.shown&&(e.code==='Space'||e.key==='Enter')){e.preventDefault();S.shown=true;render();}
  else if(S.shown&&'1234'.indexOf(e.key)>=0&&e.key){grade(+e.key-1);}
});
setInterval(function(){if(S.tab==='study'&&!S.cur&&!S.ask&&S.wait){next();render();}},15000);
build();render();
})();
</script>
</body>
